<div class="ilAuthGuardProtection" data-authguard-form="{FORM_ID}">
	<div class="ilAuthGuardTrap" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;" aria-hidden="true">
		<input type="text" name="{HONEYPOT_NAME}" value="" tabindex="-1" autocomplete="off" aria-hidden="true" />
	</div>
	<!-- BEGIN altcha -->
	<altcha-widget challenge="{CHALLENGE_URL}" name="{POW_FIELD}" auto="onload"></altcha-widget>
	<script type="module" src="{WIDGET_SCRIPT_URL}"></script>
	<!-- END altcha -->
	<!-- BEGIN recaptcha -->
	<div class="ilAuthGuardRecaptcha" data-authguard-sitekey="{RECAPTCHA_SITE_KEY}"></div>
	<script type="module" src="{RECAPTCHA_SCRIPT_URL}"></script>
	<!-- END recaptcha -->
	<!-- BEGIN recaptcha3 -->
	<input type="hidden" name="{RECAPTCHA3_FIELD}" value="" class="ilAuthGuardRecaptcha3" data-authguard-sitekey="{RECAPTCHA3_SITE_KEY}" data-authguard-action="{RECAPTCHA3_ACTION}" />
	<script type="module" src="{RECAPTCHA3_SCRIPT_URL}"></script>
	<!-- END recaptcha3 -->
	<!-- BEGIN turnstile -->
	<div class="ilAuthGuardTurnstile" data-authguard-sitekey="{TURNSTILE_SITE_KEY}"></div>
	<script type="module" src="{TURNSTILE_SCRIPT_URL}"></script>
	<!-- END turnstile -->
	<!-- BEGIN hcaptcha -->
	<div class="ilAuthGuardHcaptcha" data-authguard-sitekey="{HCAPTCHA_SITE_KEY}"></div>
	<script type="module" src="{HCAPTCHA_SCRIPT_URL}"></script>
	<!-- END hcaptcha -->
	<!-- BEGIN friendlycaptcha -->
	<div class="ilAuthGuardFriendlyCaptcha" data-authguard-sitekey="{FRIENDLYCAPTCHA_SITE_KEY}" data-authguard-endpoint="{FRIENDLYCAPTCHA_ENDPOINT}"></div>
	<script type="module" src="{FRIENDLYCAPTCHA_SCRIPT_URL}"></script>
	<!-- END friendlycaptcha -->
	<noscript>
		<div class="ilAuthGuardWidget">
			<svg class="ilAuthGuardShield" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
				<path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
			</svg>
			<img class="ilAuthGuardImage" src="{IMAGE_URL}" alt="{CAPTCHA_ALT}" />
		</div>
		<label for="authguard_code_{FORM_ID}">{CAPTCHA_LABEL} <span class="asterisk">*</span></label>
		<input type="text" class="form-control ilAuthGuardInput" id="authguard_code_{FORM_ID}" name="{CAPTCHA_FIELD}" maxlength="16" autocomplete="off" required="required" />
		<div class="help-block">{CAPTCHA_INFO}</div>
	</noscript>
</div>
